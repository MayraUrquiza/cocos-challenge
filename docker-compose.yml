services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cocos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./database.sql:/seed/database.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Por TCP: durante la inicialización Postgres solo escucha por socket,
      # así el contenedor no se marca sano hasta que terminó de cargar los datos.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "cocos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
